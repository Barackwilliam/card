# Render Blueprint: Render > New > Blueprint > chagua repo hii.
# Thamani zenye "sync: false" utaombwa kuziandika wakati wa kuanzisha.
services:
  - type: web
    name: michango-harusi
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_BUCKET
        value: kadi
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: HARUSI_MALIPO
        sync: false
      - key: WHATSAPP_BACKEND
        value: baileys

  # Worker ya WhatsApp (Baileys). Lazima iwe hewani muda wote ili kutuma foleni.
  # "free" inalala bila ombi la HTTP kwa dakika 15: weka cron-job.org iigonge kila dakika 10
  # (angalia README), au badilisha plan iwe "starter" ili isilale kamwe.
  - type: web
    name: michango-whatsapp
    runtime: node
    plan: free
    region: frankfurt
    rootDir: whatsapp-worker
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
