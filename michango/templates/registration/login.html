{% extends "michango/base.html" %}
{% block title %}Ingia{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:40px auto;width:100%">
  <h1>Ingia</h1>
  <p class="sub">Mfumo wa michango ya harusi</p>
  <form method="post" class="stack" style="margin-top:14px">{% csrf_token %}
    {% if form.errors %}<div class="msg error">Jina la mtumiaji au nenosiri si sahihi.</div>{% endif %}
    <div><label for="id_username">Jina la mtumiaji</label>{{ form.username }}</div>
    <div><label for="id_password">Nenosiri</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn pri">Ingia</button>
  </form>
</div>
{% endblock %}
